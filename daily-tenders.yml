name: Daily Renewable Tender Tracker

on:
  schedule:
    # 04:25 UTC = 09:55 IST. Started early on purpose: GitHub's shared
    # scheduler runs late under load, and a typical run takes 3-6 minutes,
    # so the data is committed and ready before 10:30 IST.
    - cron: '25 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # never let a long backfill run overlap with the next day's run
  group: tender-tracker
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_AI_LOOKUPS:    ${{ vars.MAX_AI_LOOKUPS || 0 }}
          AI_CONCURRENCY:    ${{ vars.AI_CONCURRENCY || 5 }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASS:         ${{ secrets.SMTP_PASS }}
        run: python tender_tracker.py

      - name: Job summary
        if: always()
        run: |
          echo "### Run $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 10 data/run_log.csv >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "no run log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit data
        run: |
          git config user.name  "tender-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "tenders: $(TZ=Asia/Kolkata date +%Y-%m-%d)"
          git push

      - name: Keep the schedule alive
        if: always()
        run: |
          # GitHub disables cron on repos with 60 days of no human activity.
          # Touching a tracked heartbeat file each week counts as activity.
          if [ "$(date +%u)" = "1" ]; then
            TZ=Asia/Kolkata date '+last heartbeat %d %b %Y %H:%M IST' > .heartbeat
            git add .heartbeat
            git diff --staged --quiet || (git commit -m "heartbeat" && git push)
          fi
